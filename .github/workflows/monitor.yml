name: NATS Rankings Monitor

on:
  schedule:
    # Every 30 minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the until-Saturday pause and check now"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Run monitor
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          FORCE_CHECK: ${{ github.event.inputs.force }}
        run: python monitor.py

      - name: Commit snapshot if changed
        run: |
          if ! git diff --quiet -- snapshot.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add snapshot.json
            git commit -m "Update rankings snapshot [skip ci]"
            git push
          else
            echo "snapshot.json unchanged; nothing to commit."
          fi
